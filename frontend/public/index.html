<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TakoTak - Pronostics Coupe du Monde</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var requestedMockDate = params.get('mockDate');
        var requestedMockNow = params.get('mockNow');
        var requestedMockTime = params.get('mockTime') || '12:00:00';
        var storageKey = 'TAKOTAK_MOCK_NOW';

        if (requestedMockDate === 'clear' || requestedMockNow === 'clear') {
          sessionStorage.removeItem(storageKey);
          return;
        }

        var normalizedMockDate = null;

        if (requestedMockNow) {
          normalizedMockDate = requestedMockNow;
        } else if (requestedMockDate) {
          var hasExplicitTime = requestedMockDate.indexOf('T') >= 0;
          var hasTimezone = /([+-]\d{2}:?\d{2}|Z)$/i.test(requestedMockTime);
          normalizedMockDate = hasExplicitTime
            ? requestedMockDate
            : requestedMockDate + 'T' + requestedMockTime + (hasTimezone ? '' : '+02:00');
        }

        if (normalizedMockDate) {
          var parsedMockDate = new Date(normalizedMockDate);

          if (!Number.isNaN(parsedMockDate.getTime())) {
            sessionStorage.setItem(storageKey, parsedMockDate.toISOString());
          }
        }

        window.__TAKOTAK_MOCK_NOW__ = sessionStorage.getItem(storageKey);

        if (window.__TAKOTAK_MOCK_NOW__) {
          console.warn('[TakoTak] Date simulée active :', window.__TAKOTAK_MOCK_NOW__);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
